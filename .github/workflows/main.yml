name: macOS Tahoe Remote Desktop

on:
  workflow_dispatch:

jobs:
  macos-remote:
    runs-on: macos-26
    timeout-minutes: 360

    steps:
      - name: Show macOS details
        run: |
          sw_vers
          echo "Runner user: $(whoami)"

      - name: Connect runner to Tailscale
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          tags: tag:ci

      - name: Install macOS RDP server
        shell: bash
        run: |
          set -e

          sudo mkdir -p /usr/local/sbin

          sudo curl -fsSL \
            https://github.com/grioghar/macos-rdp-server/releases/latest/download/macos-rdp-daemon \
            -o /usr/local/sbin/macos-rdp-daemon

          sudo chmod +x /usr/local/sbin/macos-rdp-daemon

          sudo mkdir -p /etc/macos-rdp

          # Generate a local TLS certificate.
          sudo openssl req -x509 -newkey rsa:2048 -sha256 -days 2 -nodes \
            -keyout /etc/macos-rdp/server.key \
            -out /etc/macos-rdp/server.crt \
            -subj "/CN=macos-tahoe-runner" >/dev/null 2>&1

      - name: Configure RDP server
        shell: bash
        run: |
          set -e

          # NOTE:
          # The macOS runner's GUI/TCC permissions may prevent screen
          # capture/input from working. This is a limitation of hosted
          # macOS GUI sessions and is not fixed by Tailscale.

          sudo tee /Library/LaunchDaemons/com.macosrdp.daemon.plist >/dev/null <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN"
            "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>Label</key>
            <string>com.macosrdp.daemon</string>

            <key>ProgramArguments</key>
            <array>
              <string>/usr/local/sbin/macos-rdp-daemon</string>
              <string>--port</string>
              <string>3389</string>
            </array>

            <key>RunAtLoad</key>
            <true/>

            <key>KeepAlive</key>
            <true/>

            <key>StandardOutPath</key>
            <string>/var/log/macos-rdp-daemon.out.log</string>

            <key>StandardErrorPath</key>
            <string>/var/log/macos-rdp-daemon.error.log</string>
          </dict>
          </plist>
          PLIST

          sudo chown root:wheel /Library/LaunchDaemons/com.macosrdp.daemon.plist
          sudo chmod 644 /Library/LaunchDaemons/com.macosrdp.daemon.plist

          sudo launchctl bootout system/com.macosrdp.daemon 2>/dev/null || true
          sudo launchctl bootstrap system /Library/LaunchDaemons/com.macosrdp.daemon.plist
          sudo launchctl kickstart -k system/com.macosrdp.daemon

      - name: Print connection information
        shell: bash
        run: |
          echo "===== TAILSCALE ====="
          tailscale status || true
          echo
          echo "===== TAILSCALE IPv4 ====="
          tailscale ip -4 || true
          echo
          echo "===== RDP LISTENER ====="
          sudo lsof -nP -iTCP:3389 -sTCP:LISTEN || true
          echo
          echo "Connect from Windows Remote Desktop to:"
          echo "  <TAILSCALE-IP>:3389"
          echo
          echo "KEEP THIS GITHUB ACTION RUNNING."

      - name: Keep session alive
        shell: bash
        run: |
          echo "Remote macOS session is active."
          echo "The job will remain alive until the workflow is cancelled or GitHub's job limit is reached."
          sleep 21600
